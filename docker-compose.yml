version: "3.9"

services:
  campusmind:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PORT=8080
    volumes:
      - campusmind_data:/app/campusmind_data
      - ./campusmind/uploads:/app/campusmind/uploads
      - ./campusmind/outputs:/app/campusmind/outputs
      - ./campusmind/logs:/app/campusmind/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  campusmind_data:
